version: "3.9"

services:

  enterprise-knowledge-assistant:

    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: enterprise-knowledge-assistant

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - ../.env

    volumes:
      - ../data:/app/data

    depends_on:
      - chromadb
      - neo4j

    networks:
      - eka-network

  chromadb:

    image: chromadb/chroma:latest

    container_name: chromadb

    restart: unless-stopped

    ports:
      - "8001:8000"

    volumes:
      - ../data/chroma:/chroma/chroma

    networks:
      - eka-network

  neo4j:

    image: neo4j:5.26

    container_name: neo4j

    restart: unless-stopped

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

    networks:
      - eka-network

networks:

  eka-network:
    driver: bridge

volumes:

  neo4j_data:

  neo4j_logs: